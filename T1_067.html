<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konversi Suhu - T1_067</title>
    <style>
       
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4;}
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        label, select, input, button { display: block; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        input, select { padding: 8px; }
        button { padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        #hasil { margin-top: 10px; font-size: 18px; font-weight: bold; color: #333; text-align: center; }
    </style>
   
    <script src="T1_067.js" defer></script>
</head>
<body>

    <div class="container">
        <h2>Aplikasi Konversi Suhu</h2>
        <form id="formKonversi">
            <label for="nilaiSuhu">Masukkan Nilai Suhu:</label>
            <input type="number" id="nilaiSuhu" step="any" placeholder="Contoh: 30.5" required>

            <label for="tipeKonversi">Pilih Jenis Konversi:</label>
            <select id="tipeKonversi" required>
                <option value="CtoF">Celsius ke Fahrenheit</option>
                <option value="CtoR">Celsius ke Reamur</option>
                <option value="FtoC">Fahrenheit ke Celsius</option>
                <option value="FtoR">Fahrenheit ke Reamur</option>
                <option value="RtoC">Reamur ke Celsius</option>
                <option value="RtoF">Reamur ke Fahrenheit</option>
            </select>

            <button type="submit">Konversi Suhu</button>
        </form>
        
        <!-- Elemen div untuk menampilkan hasil -->
        <div id="hasil"></div>
    </div>

</body>
</html>
