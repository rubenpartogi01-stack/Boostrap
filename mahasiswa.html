<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Data Mahasiswa | SIAKUH</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="app.js" defer></script>
</head>
<body class="records-page" data-page="mahasiswa">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"><i class="bi bi-mortarboard-fill"></i></div><div>SIAKUH <small>APP</small></div></div>
      <nav class="nav-menu" aria-label="Navigasi utama">
        <a class="nav-item" href="dashboard.html"><span class="nav-icon"><i class="bi bi-speedometer2"></i></span><span>Dashboard</span></a>
        <div class="nav-section-title" style="padding-top: 10px; padding-bottom: 8px;">Master Data</div>
        <a class="nav-item" href="prodi.html"><span class="nav-icon"><i class="bi bi-bank2"></i></span><span>Master Data Prodi</span></a>
        <a class="nav-item active" href="mahasiswa.html" aria-current="page"><span class="nav-icon"><i class="bi bi-mortarboard-fill"></i></span><span>Master Data Mahasiswa</span></a>
        <div class="nav-section-title" style="padding-top: 10px; padding-bottom: 8px;">Transaksi</div>
        <a class="nav-item" href="dashboard.html"><span class="nav-icon"><i class="bi bi-calculator"></i></span><span>Transaksi Penilaian</span></a>
      </nav>
      <div class="sidebar-bottom"><div class="collapse-btn" aria-hidden="true">‹</div></div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="user-block"><span>Dr. Dosen Pengampuh, M.Kom</span><span class="user-badge">DP</span></div></header>
      <section class="content">
        <div class="page-header">
          <h1 class="page-title"><i class="bi bi-mortarboard-fill text-primary"></i> Master Data Mahasiswa</h1>
          <button class="btn btn-primary-custom" type="button" data-add-record><i class="bi bi-plus-circle-fill"></i> Tambah Mahasiswa Baru</button>
        </div>

        <section class="records-card" aria-labelledby="recordsTitle">
          <div class="records-card-title" id="recordsTitle">Daftar Data Mahasiswa Terdaftar</div>
          <div class="records-toolbar">
            <label>Show <select data-page-size aria-label="Jumlah data per halaman"><option>10</option><option>25</option><option>50</option></select> entries</label>
            <label class="records-search">Search: <input type="search" data-search aria-label="Cari mahasiswa" /></label>
          </div>
          <div class="records-table-wrap">
            <table class="records-table">
              <thead data-table-head></thead>
              <tbody data-table-body></tbody>
            </table>
          </div>
          <div class="records-pagination">
            <span data-entry-summary></span>
            <div class="pagination-controls" data-pagination></div>
          </div>
        </section>
        <footer class="footer">SIAKAD © Master Data Mahasiswa 2026</footer>
      </section>
    </main>
  </div>

  <div class="record-modal-backdrop" data-modal hidden>
    <section class="record-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <form data-record-form>
        <div class="record-modal-header"><span data-modal-title id="modalTitle">Form Mahasiswa</span><button type="button" data-close-modal aria-label="Tutup">&times;</button></div>
        <div class="record-modal-body"><div class="record-fields" data-modal-fields></div></div>
        <div class="record-modal-footer"><button class="modal-button cancel" type="button" data-close-modal>Batal</button><button class="modal-button save" type="submit"><i class="bi bi-floppy-fill"></i> Simpan Data</button></div>
      </form>
    </section>
  </div>
</body>
</html>
